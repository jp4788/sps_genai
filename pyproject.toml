[project]
name = "sps-genai"
version = "0.1.0"
requires-python = ">=3.11,<3.14"

dependencies = [
    "fastapi[standard]>=0.141.1",
    "spacy>=3.8.16",
    "en-core-web-lg @ https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl",
    "torch==2.2.2; python_version == '3.11'",
    "torchvision==0.17.2; python_version == '3.11'",
    "pillow",
    "python-multipart",
    "numpy>=1.24,<2; python_version == '3.11'",
]
